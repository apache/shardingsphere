decision = "proceed"
required_actions = ["inspect_local", "edit_code", "run_local_checks", "run_pre_handoff_review"]
allowed_actions = ["inspect_local", "edit_code", "run_local_checks", "wrap_high_output", "run_pre_handoff_review", "fix_review_findings", "propose_commit_message"]
