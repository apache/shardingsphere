ordinary_loop = true
prompt = "During an active task, a new hunk appears in an allowed file after the baseline, but no recorded current-task write produced it and its ownership is unknown. At this decision point, inspect and report the conflict only; do not overwrite, format, remove, roll back, or classify the hunk as task-owned."
