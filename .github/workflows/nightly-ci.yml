name: Nightly - CI

on:
  schedule:
    - cron: '0 13 * * 1-5' # Once a day between Monday and Friday. UTC time
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAVEN_ARGS: -B -ntp -fae
  MAVEN_OPTS: -Dhttp.keepAlive=false

jobs:
  global-environment:
    name: Import Global Environment
    uses: ./.github/workflows/reusable-global-environment.yml

  ci:
    if: ${{ needs.global-environment.outputs.GLOBAL_JOB_ENABLED == 'true' }}
    name: CI - JDK ${{ matrix.java-version }} on ${{ matrix.os }}
    needs: global-environment
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      max-parallel: 15
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        java-version: [ 21, 25, 26 ]
    steps:
      - name: Support Long Paths in Windows
        if: matrix.os == 'windows-latest'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6.0.1
      - uses: ./.github/actions/setup-build-environment
        with:
          java-version: ${{ matrix.java-version }}
      - name: Build Project with Maven
        run: ./mvnw clean install -T1C
      - name: Build Examples with Maven
        run: ./mvnw clean package -f examples/pom.xml -T1C
