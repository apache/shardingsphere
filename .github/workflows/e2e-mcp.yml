name: E2E - MCP

on:
  pull_request:
    branches: [ master ]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - '.github/workflows/e2e-mcp.yml'
      - 'distribution/mcp/**'
      - 'mcp/**'
      - 'test/e2e/mcp/**'
  schedule:
    - cron: '0 19 * * 1-5'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAVEN_ARGS: -B -ntp -fae -e
  MAVEN_OPTS: -Dhttp.keepAlive=false
  MAVEN_REPOSITORY_DIR: ../.e2e-maven/repository
  MCP_CONFORMANCE_REF: 21a9a2febd7100d7c17ac1021ee7f2ed9f66a1e0

jobs:
  global-environment:
    name: Import Global Environment
    uses: ./.github/workflows/reusable-global-environment.yml

  e2e-mcp-build-images:
    name: E2E - MCP Build Images
    if: ${{ needs.global-environment.outputs.GLOBAL_JOB_ENABLED == 'true' }}
    needs: global-environment
    runs-on: ${{ needs.global-environment.outputs.GLOBAL_RUNS_ON }}
    timeout-minutes: 60
    outputs:
      maven-artifact-id: ${{ steps.upload-maven.outputs.artifact-id }}
      distribution-artifact-id: ${{ steps.upload-distribution.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-build-environment
        with:
          java-version: '21'
          maven-repository-dir: ${{ env.MAVEN_REPOSITORY_DIR }}
          cache-suffix: 'e2e-mcp'
          cache-save-enabled: 'false'
          enable-docker-setup: 'true'
      - name: Restore MCP Distribution Image Cache
        id: prepare-image
        uses: ./.github/actions/prepare-e2e-docker
        with:
          type: source
          image: apache/shardingsphere-mcp-e2e
      - name: Check Docker Environment
        run: |
          docker version
          docker system df
      - name: Build MCP E2E Test Dependencies and Distribution
        run: ./mvnw -Dmaven.repo.local="$E2E_MAVEN_REPOSITORY" -pl test/e2e/mcp,distribution/mcp -am install -DskipTests -DskipITs -Dspotless.skip=true
      - name: Build MCP Distribution Image
        if: steps.prepare-image.outputs.cache-hit != 'true'
        env:
          MCP_DISTRIBUTION_IMAGE: ${{ steps.prepare-image.outputs.image }}
        run: |
          docker build \
            --platform "$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')" \
            -f distribution/mcp/Dockerfile \
            -t "${MCP_DISTRIBUTION_IMAGE}" \
            distribution/mcp/target
      - name: Save E2E Image Cache
        if: steps.prepare-image.outputs.cache-hit != 'true'
        uses: ./.github/actions/prepare-e2e-docker
        with:
          type: source
          operation: save
          image: ${{ steps.prepare-image.outputs.image }}
      - name: Upload MCP Maven Repository
        id: upload-maven
        uses: ./.github/actions/upload-e2e-artifacts
        with:
          artifact-name: mcp-e2e-maven-repository
          maven-repository-dir: ${{ env.MAVEN_REPOSITORY_DIR }}
      - name: Upload MCP Distribution
        id: upload-distribution
        uses: ./.github/actions/upload-e2e-artifacts
        with:
          artifact-name: mcp-e2e-distribution
          include-maven-repository: 'false'
          include-distribution: 'true'
          image-archive: ${{ steps.prepare-image.outputs.archive }}

  e2e-mcp-functionality:
    name: E2E - MCP Functionality
    if: ${{ needs.global-environment.outputs.GLOBAL_JOB_ENABLED == 'true' }}
    needs: [ global-environment, e2e-mcp-build-images ]
    runs-on: ${{ needs.global-environment.outputs.GLOBAL_RUNS_ON }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-build-environment
        with:
          maven-repository-dir: ${{ env.MAVEN_REPOSITORY_DIR }}
          java-version: '21'
          cache-suffix: 'e2e-mcp'
          cache-save-enabled: 'false'
          enable-docker-setup: 'true'
      - name: Download MCP Maven Repository
        uses: ./.github/actions/download-e2e-artifacts
        with:
          maven-repository-dir: ${{ env.MAVEN_REPOSITORY_DIR }}
          artifact-id: ${{ needs.e2e-mcp-build-images.outputs.maven-artifact-id }}
          load-docker-image: 'false'
      - name: Download MCP Distribution
        id: download-distribution
        uses: ./.github/actions/download-e2e-artifacts
        with:
          artifact-id: ${{ needs.e2e-mcp-build-images.outputs.distribution-artifact-id }}
          restore-maven-repository: 'false'
          restore-distribution: 'true'
      - name: Run MCP Functionality E2E
        run: ./mvnw -Dmaven.repo.local="$E2E_MAVEN_REPOSITORY" -pl test/e2e/mcp verify -Pe2e.mcp.functionality -De2e.run.type=DOCKER -Dmcp.e2e.container.image="${{ steps.download-distribution.outputs.image }}" -Dmcp.e2e.artifact-root="${{ github.workspace }}/test/e2e/mcp/target/functionality-e2e" -Dspotless.skip=true
      - name: Upload MCP Functionality E2E Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-mcp-functionality-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test/e2e/mcp/target/failsafe-reports
            test/e2e/mcp/target/functionality-e2e
          if-no-files-found: warn

  e2e-mcp-conformance:
    name: E2E - MCP Conformance
    if: ${{ needs.global-environment.outputs.GLOBAL_JOB_ENABLED == 'true' }}
    needs: [ global-environment, e2e-mcp-build-images ]
    runs-on: ${{ needs.global-environment.outputs.GLOBAL_RUNS_ON }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download MCP Distribution
        id: download-distribution
        uses: ./.github/actions/download-e2e-artifacts
        with:
          artifact-id: ${{ needs.e2e-mcp-build-images.outputs.distribution-artifact-id }}
          restore-maven-repository: 'false'
      - name: Checkout Pinned MCP Conformance Runner
        uses: actions/checkout@v7.0.1
        with:
          repository: modelcontextprotocol/conformance
          ref: ${{ env.MCP_CONFORMANCE_REF }}
          path: .mcp-conformance
      - name: Prepare MCP Conformance Runner
        id: prepare-conformance
        uses: ./.github/actions/prepare-e2e-docker
        with:
          type: tool
          image: apache/shardingsphere-mcp-conformance
          dockerfile: test/e2e/mcp/src/test/resources/docker/conformance/Dockerfile
          context: .mcp-conformance
          source-revision: ${{ env.MCP_CONFORMANCE_REF }}
      - name: Run MCP 2025-11-25 Conformance Scenarios
        shell: bash
        env:
          CONFORMANCE_IMAGE: ${{ steps.prepare-conformance.outputs.image }}
          MCP_DISTRIBUTION_IMAGE: ${{ steps.download-distribution.outputs.image }}
        run: |
          set -euo pipefail
          generic_scenarios=(
            server-initialize
            ping
            logging-set-level
            tools-list
            resources-list
            prompts-list
            dns-rebinding-protection
          )
          container_name="shardingsphere-mcp-conformance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          runner_name="${container_name}-runner"
          cleanup() {
            docker logs "${container_name}" >"${RUNNER_TEMP}/mcp-conformance-server.log" 2>&1 || true
            docker rm -f "${runner_name}" >/dev/null 2>&1 || true
            docker rm -f "${container_name}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --rm -d --name "${container_name}" --network host \
            -e SHARDINGSPHERE_MCP_CONFIG=/opt/shardingsphere-mcp/conf/mcp-http.yaml \
            "${MCP_DISTRIBUTION_IMAGE}"
          for ignored in {1..60}; do
            if curl --silent --output /dev/null --request POST http://127.0.0.1:18088/mcp; then
              break
            fi
            sleep 1
          done
          curl --silent --output /dev/null --request POST http://127.0.0.1:18088/mcp
          results_root="${RUNNER_TEMP}/mcp-conformance-results"
          mkdir -p "${results_root}"
          version_scenarios="$(
            docker run --rm --name "${runner_name}" --network host --user "$(id -u):$(id -g)" \
              "${CONFORMANCE_IMAGE}" list --server --spec-version 2025-11-25 \
              | sed -nE 's/^[[:space:]]+- ([^ ]+).*/\1/p'
          )"
          for scenario in "${generic_scenarios[@]}"; do
            if ! grep -Fxq -- "${scenario}" <<<"${version_scenarios}"; then
              echo "MCP conformance scenario '${scenario}' is unavailable for protocol version 2025-11-25." >&2
              exit 1
            fi
            docker run --rm --name "${runner_name}" --network host --user "$(id -u):$(id -g)" \
              --mount "type=bind,src=${results_root},dst=/results" \
              "${CONFORMANCE_IMAGE}" server \
              --url http://127.0.0.1:18088/mcp \
              --scenario "${scenario}" \
              --output-dir "/results/${scenario}"
            checks_file="$(find "${results_root}/${scenario}" -type f -name checks.json -print -quit 2>/dev/null || true)"
            if [[ -z "${checks_file}" ]] || ! jq -e 'type == "array" and length > 0' "${checks_file}" >/dev/null; then
              echo "MCP conformance scenario '${scenario}' produced no checks." >&2
              exit 1
            fi
          done
      - name: Upload MCP Conformance Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-mcp-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mcp-conformance-results
            ${{ runner.temp }}/mcp-conformance-server.log
          if-no-files-found: warn

  e2e-mcp-llm:
    name: E2E - MCP LLM - ${{ matrix.id }}
    if: ${{ needs.global-environment.outputs.GLOBAL_JOB_ENABLED == 'true' }}
    needs: [ global-environment, e2e-mcp-build-images ]
    runs-on: ${{ needs.global-environment.outputs.GLOBAL_RUNS_ON }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - id: http-read-only-query
            test: LLMHttpE2EIT#assertReadOnlyQuery
          - id: http-metadata-discovery
            test: LLMHttpE2EIT#assertMetadataDiscovery
          - id: http-mask-planning
            test: LLMHttpE2EIT#assertMaskPlanning
          - id: http-side-effect-preview
            test: LLMHttpE2EIT#assertSideEffectPreview
          - id: http-invalid-resource-recovery
            test: LLMHttpE2EIT#assertInvalidResourceRecovery
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-build-environment
        with:
          maven-repository-dir: ${{ env.MAVEN_REPOSITORY_DIR }}
          java-version: '21'
          cache-suffix: 'e2e-mcp'
          cache-save-enabled: 'false'
          enable-docker-setup: 'true'
      - name: Download MCP Maven Repository
        uses: ./.github/actions/download-e2e-artifacts
        with:
          maven-repository-dir: ${{ env.MAVEN_REPOSITORY_DIR }}
          artifact-id: ${{ needs.e2e-mcp-build-images.outputs.maven-artifact-id }}
          load-docker-image: 'false'
      - name: Install Docker Model Runner
        id: install-model-runner
        shell: bash
        env:
          MODEL_RUNNER_CONTROLLER_VERSION: v1.2.8@sha256:5bdc2bac71c1b70453f7dec5b527031bc6d8d99b8d1b2a10a8bcca073ae257a3
          MODEL_RUNNER_CONTROLLER_VARIANT: cpu
        run: |
          set -euo pipefail
          . /etc/os-release
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo curl --fail --silent --show-error --location https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          sudo chmod a+r /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu ${UBUNTU_CODENAME:-$VERSION_CODENAME} stable" \
            | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y "docker-model-plugin=1.2.6-1~ubuntu.${VERSION_ID}~${UBUNTU_CODENAME:-$VERSION_CODENAME}"
          docker model install-runner --gpu none
          model="$(awk -F= '$1 == "mcp.llm.model" {print $2}' test/e2e/mcp/src/test/resources/env/e2e-env.properties)"
          echo "model=${model}" >> "${GITHUB_OUTPUT}"
      - name: Pull MCP LLM
        uses: ./.github/actions/prepare-e2e-docker
        with:
          type: standard
          kind: model
          reference: ${{ steps.install-model-runner.outputs.model }}
      - name: Configure MCP LLM
        shell: bash
        env:
          MCP_LLM_MODEL: ${{ steps.install-model-runner.outputs.model }}
        run: |
          set -euo pipefail
          docker model configure --context-size 8192 "${MCP_LLM_MODEL}" -- \
            --jinja --reasoning-budget 0 --reasoning-format deepseek --chat-template-kwargs '{"enable_thinking":false}' \
            --parallel 1 -b 256 -ub 128 --cache-ram 0 --no-cache-prompt
          docker model run --detach "${MCP_LLM_MODEL}"
      - name: Run MCP LLM E2E
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: ./mvnw -Dmaven.repo.local="$E2E_MAVEN_REPOSITORY" -pl test/e2e/mcp verify -Pe2e.mcp.llm -De2e.run.type=DOCKER -Dspotless.skip=true -Dit.test='${{ matrix.test }}' -Dmcp.llm.artifact-root="${{ github.workspace }}/test/e2e/mcp/target/llm-e2e" -Dmcp.llm.run-id=gha-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
      - name: Upload MCP LLM E2E Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-mcp-llm-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test/e2e/mcp/target/llm-e2e
            test/e2e/mcp/target/failsafe-reports
          if-no-files-found: warn
