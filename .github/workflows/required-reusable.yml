on:
  workflow_call:
    outputs:
      GLOBAL_CACHE_PREFIX:
        value: ${{ jobs.init-environment.outputs.GLOBAL_CACHE_PREFIX }}
      GLOBAL_RUNS_ON:
        value: ${{ jobs.init-environment.outputs.GLOBAL_RUNS_ON }}
      GLOBAL_JOB_ENABLED:
        value: ${{ jobs.init-environment.outputs.GLOBAL_JOB_ENABLED }}
      GLOBAL_IS_NIGHTLY_JOB_EXECUTABLE:
        value: ${{ jobs.init-environment.outputs.GLOBAL_IS_NIGHTLY_JOB_EXECUTABLE }}

permissions:
  contents: read

jobs:
  init-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set Global Environment
        id: global-environment
        env:
          GLOBAL_REPOSITORY: ${{ vars.GLOBAL_REPOSITORY || (github.repository == 'apache/shardingsphere' && github.event_name == 'pull_request' && github.repository) || '' }}
          DISABLE_CI: ${{ vars.DISABLE_CI }}
        run: |
          echo "GLOBAL_CACHE_PREFIX=${GLOBAL_REPOSITORY//\//-}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REPOSITORY" = "$GLOBAL_REPOSITORY" ]; then
            echo "GLOBAL_IS_NIGHTLY_JOB_EXECUTABLE=true" >> "$GITHUB_OUTPUT"
            if [ -z "$DISABLE_CI" ] || [ "$DISABLE_CI" = "false" ]; then
              echo "GLOBAL_JOB_ENABLED=true" >> "$GITHUB_OUTPUT"
            else
              echo "GLOBAL_JOB_ENABLED=false" >> "$GITHUB_OUTPUT"
            fi
          fi
    outputs:
      GLOBAL_RUNS_ON: ${{ github.repository == 'apache/shardingsphere' && github.event_name == 'pull_request' && 'ubuntu-latest' || vars.GLOBAL_RUNS_ON }}
      GLOBAL_JOB_ENABLED: ${{ steps.global-environment.outputs.GLOBAL_JOB_ENABLED }}
      GLOBAL_CACHE_PREFIX: ${{ steps.global-environment.outputs.GLOBAL_CACHE_PREFIX }}
      GLOBAL_IS_NIGHTLY_JOB_EXECUTABLE: ${{ steps.global-environment.outputs.GLOBAL_IS_NIGHTLY_JOB_EXECUTABLE }}
