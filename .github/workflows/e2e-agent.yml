name: E2E - Agent

on:
  pull_request:
    branches: [ master ]
    paths:
      - '.github/workflows/e2e-agent.yml'
      - '**/pom.xml'
      - '**/src/main/**'
      - '!mcp/**'
      - '!test/**'
      - 'test/pom.xml'
      - 'test/e2e/agent/**'
      - '!distribution/**'
      - 'distribution/proxy/**'
      - 'distribution/jdbc/**'
      - '!distribution/**/src/main/release-docs/**'
      - '!examples/**'
      - '!*.md'
  schedule:
    - cron: '0 0 * * 1-5' # Once a day between Monday and Friday. UTC time
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAVEN_ARGS: -B -ntp -fae -e
  MAVEN_OPTS: -Dhttp.keepAlive=false
  MAVEN_REPOSITORY_DIR: ../.e2e-maven/repository

jobs:
  global-environment:
    name: Import Global Environment
    uses: ./.github/workflows/reusable-global-environment.yml

  build-e2e-image:
    if: ${{ needs.global-environment.outputs.GLOBAL_JOB_ENABLED == 'true' }}
    name: Build E2E Image
    needs: global-environment
    runs-on: ${{ needs.global-environment.outputs.GLOBAL_RUNS_ON }}
    timeout-minutes: 40
    outputs:
      proxy-artifact-id: ${{ steps.upload-proxy-image.outputs.artifact-id }}
      jdbc-artifact-id: ${{ steps.upload-jdbc-image.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: setup-build-environment
        uses: ./.github/actions/setup-build-environment
        with:
          java-version: 21
          maven-repository-dir: ${{ env.MAVEN_REPOSITORY_DIR }}
          cache-suffix: 'e2e-agent'
          cache-save-enabled: 'false'
          enable-docker-setup: 'true'
      - name: Restore Proxy E2E Image Cache
        id: prepare-proxy-image
        uses: ./.github/actions/prepare-e2e-docker
        with:
          type: source
          image: apache/shardingsphere-proxy-agent-test
      - name: Restore JDBC E2E Image Cache
        id: prepare-jdbc-image
        uses: ./.github/actions/prepare-e2e-docker
        with:
          type: source
          image: apache/shardingsphere-jdbc-agent-test
      - name: Build Project
        if: steps.prepare-proxy-image.outputs.cache-hit != 'true' || steps.prepare-jdbc-image.outputs.cache-hit != 'true'
        run: ./mvnw -Dmaven.repo.local="$E2E_MAVEN_REPOSITORY" clean install -DskipTests -Prelease,default-dep
      - name: Build Proxy E2E Image
        if: steps.prepare-proxy-image.outputs.cache-hit != 'true'
        shell: bash
        env:
          PROXY_IMAGE: ${{ steps.prepare-proxy-image.outputs.image }}
        run: ./mvnw -Dmaven.repo.local="$E2E_MAVEN_REPOSITORY" install -DskipTests -Pe2e.env.proxy -Ddockerfile.tag="${PROXY_IMAGE##*:}" -f test/e2e/agent/engine/pom.xml
      - name: Save Proxy E2E Image Cache
        if: steps.prepare-proxy-image.outputs.cache-hit != 'true'
        uses: ./.github/actions/prepare-e2e-docker
        with:
          type: source
          operation: save
          image: ${{ steps.prepare-proxy-image.outputs.image }}
      - name: Upload Proxy E2E Image
        id: upload-proxy-image
        uses: ./.github/actions/upload-e2e-artifacts
        with:
          artifact-name: proxy-e2e-image
          include-maven-repository: 'false'
          image-archive: ${{ steps.prepare-proxy-image.outputs.archive }}
      - name: Build JDBC E2E Image
        if: steps.prepare-jdbc-image.outputs.cache-hit != 'true'
        shell: bash
        env:
          JDBC_IMAGE: ${{ steps.prepare-jdbc-image.outputs.image }}
        run: ./mvnw -Dmaven.repo.local="$E2E_MAVEN_REPOSITORY" install -DskipTests -Pe2e.env.jdbc -Ddockerfile.tag="${JDBC_IMAGE##*:}" -f test/e2e/agent/engine/pom.xml
      - name: Save JDBC E2E Image Cache
        if: steps.prepare-jdbc-image.outputs.cache-hit != 'true'
        uses: ./.github/actions/prepare-e2e-docker
        with:
          type: source
          operation: save
          image: ${{ steps.prepare-jdbc-image.outputs.image }}
      - uses: ./.github/actions/save-maven-cache
        with:
          maven-repository-dir: ${{ env.MAVEN_REPOSITORY_DIR }}
          cache-hit: ${{ steps.setup-build-environment.outputs.cache-hit }}
          cache-primary-key: ${{ steps.setup-build-environment.outputs.cache-primary-key }}
      - name: Upload JDBC E2E Image
        id: upload-jdbc-image
        uses: ./.github/actions/upload-e2e-artifacts
        with:
          artifact-name: jdbc-e2e-image
          include-maven-repository: 'false'
          image-archive: ${{ steps.prepare-jdbc-image.outputs.archive }}

  agent-mysql:
    name: E2E - Agent with MySQL
    if: ${{ needs.global-environment.outputs.GLOBAL_JOB_ENABLED == 'true' }}
    needs: [ global-environment, build-e2e-image ]
    runs-on: ${{ needs.global-environment.outputs.GLOBAL_RUNS_ON }}
    timeout-minutes: 40
    strategy:
      max-parallel: 15
      fail-fast: false
      matrix:
        include:
          - adapter: proxy
            feature: tracing
            plugin: jaeger
          - adapter: proxy
            feature: metrics
            plugin: prometheus
          - adapter: proxy
            feature: logging
            plugin: file
          - adapter: jdbc
            feature: logging
            plugin: file
          - adapter: jdbc
            feature: metrics
            plugin: prometheus
          - adapter: jdbc
            feature: tracing
            plugin: jaeger
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-build-environment
        with:
          maven-repository-dir: ${{ env.MAVEN_REPOSITORY_DIR }}
          java-version: 21
          cache-suffix: 'e2e-agent'
          cache-save-enabled: 'false'
          enable-docker-setup: 'true'
      - name: Download Proxy E2E Image
        id: download-proxy-image
        if: matrix.adapter == 'proxy'
        uses: ./.github/actions/download-e2e-artifacts
        with:
          artifact-id: ${{ needs.build-e2e-image.outputs.proxy-artifact-id }}
          restore-maven-repository: 'false'
      - name: Download JDBC E2E Image
        id: download-jdbc-image
        if: matrix.adapter == 'jdbc'
        uses: ./.github/actions/download-e2e-artifacts
        with:
          artifact-id: ${{ needs.build-e2e-image.outputs.jdbc-artifact-id }}
          restore-maven-repository: 'false'
      - name: Build Project
        run: ./mvnw -Dmaven.repo.local="$E2E_MAVEN_REPOSITORY" clean install -am -pl test/e2e/agent/plugins/${{ matrix.feature }}/${{ matrix.plugin }} -DskipTests
      - name: Run E2E Test
        run: ./mvnw -Dmaven.repo.local="$E2E_MAVEN_REPOSITORY" -nsu install -f test/e2e/agent/plugins/${{ matrix.feature }}/${{ matrix.plugin }}/pom.xml -De2e.run.type=DOCKER -De2e.env.adapter=${{ matrix.adapter }} -De2e.env.plugin=${{ matrix.plugin }} -Dproxy.image="${{ steps.download-proxy-image.outputs.image }}" -Djdbc.project.image="${{ steps.download-jdbc-image.outputs.image }}"
