name: CI - MCP

on:
  pull_request:
    branches: [ master ]
    paths:
      - '.github/workflows/ci-mcp.yml'
      - '.github/actions/setup-build-environment/**'
      - 'pom.xml'
      - 'database/connector/**'
      - 'mcp/**'
  workflow_dispatch:

concurrency:
  group: ci-mcp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAVEN_ARGS: -B -ntp -fae
  MAVEN_OPTS: -Dhttp.keepAlive=false

jobs:
  global-environment:
    name: Import Global Environment
    uses: ./.github/workflows/reusable-global-environment.yml

  mcp-ci:
    name: MCP - CI with JDK 21
    needs: global-environment
    if: ${{ needs.global-environment.outputs.GLOBAL_JOB_ENABLED == 'true' }}
    runs-on: ${{ needs.global-environment.outputs.GLOBAL_RUNS_ON }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: ./.github/actions/setup-build-environment
        with:
          java-version: '21'
          cache-suffix: 'mcp'
      - name: Run MCP Unit Tests
        shell: bash
        run: |
          set -euo pipefail
          MCP_MODULES=mcp/api,mcp/support,mcp/core,mcp/features/broadcast,mcp/features/encrypt,mcp/features/mask
          MCP_MODULES="${MCP_MODULES},mcp/features/readwrite-splitting,mcp/features/shadow,mcp/features/sharding"
          MCP_MODULES="${MCP_MODULES},mcp/bootstrap,mcp/registry"
          ./mvnw -pl "${MCP_MODULES}" -am install \
            -DskipITs -Dspotless.skip=true \
            -Dsurefire.failIfNoSpecifiedTests=false
      - name: Run MCP HTTP Integration Test
        run: ./mvnw -pl mcp/bootstrap verify -DskipITs=false -Dspotless.skip=true
      - name: Verify MCP Metadata Pagination Coverage
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -pl mcp/core verify -Pcoverage-check \
            -DskipITs -Dspotless.skip=true -Djacoco.skip=false \
            -Djacoco.check.class.pattern='org.apache.shardingsphere.mcp.core.tool.handler.metadata.SearchMetadata*' \
            -Dsurefire.failIfNoSpecifiedTests=false
