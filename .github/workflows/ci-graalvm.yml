name: CI - GraalVM

on:
  pull_request:
    branches: [ master ]
    paths:
      - '.github/workflows/ci-graalvm.yml'
      - '.github/workflows/reusable-global-environment.yml'
      - '.github/actions/setup-build-environment/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.mvn/**'
      - '**/pom.xml'
      - 'infra/reachability-metadata/**'
      - 'test/native/**'
  schedule:
    - cron: '0 13 * * 1-5' # Once a day between Monday and Friday. UTC time
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAVEN_ARGS: -B -ntp -fae -e
  MAVEN_OPTS: -Dhttp.keepAlive=false

jobs:
  global-environment:
    name: Import Global Environment
    uses: ./.github/workflows/reusable-global-environment.yml
  ci:
    name: GraalVM - Native Tests on ${{ matrix.os }}
    needs: global-environment
    if: ${{ needs.global-environment.outputs.GLOBAL_JOB_ENABLED == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # TODO After the issue at https://github.com/apache/shardingsphere/issues/38857 is resolved, add `windows-latest`
        os: [ '${{ needs.global-environment.outputs.GLOBAL_RUNS_ON }}' ]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Free Disk Space on Ubuntu
        if: matrix.os == '${{ needs.global-environment.outputs.GLOBAL_RUNS_ON }}'
        run: ./test/native/src/test/resources/test-native/sh/free-disk-space.sh
      - name: Setup Rancher Desktop without GUI on Windows Server
        if: matrix.os == 'windows-latest'
        run: ./test/native/src/test/resources/test-native/ps1/config-rdctl.ps1
      - uses: ./.github/actions/setup-build-environment
        with:
          distribution: 'graalvm-community'
      # TODO Remove this workaround after. The graalvm native image built with windows server is missing some GRMs for testcontainers
      - name: Run test with GraalVM CE
        if: matrix.os == 'windows-latest'
        run: ./mvnw -PgenerateMetadata -T1C clean verify
      - name: Run Native Tests with GraalVM CE
        if: matrix.os == '${{ needs.global-environment.outputs.GLOBAL_RUNS_ON }}'
        run: ./mvnw -PnativeTestInShardingSphere clean verify
