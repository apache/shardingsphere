name: E2E - Operation

on:
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAVEN_ARGS: -B -ntp -fae
  MAVEN_OPTS: -Dhttp.keepAlive=false -Dfailsafe.skipAfterFailureCount=1 -Dio.netty.leakDetectionLevel=advanced
  MAVEN_REPOSITORY_DIR: ../.e2e-maven/repository

jobs:
  global-environment:
    name: Import Global Environment
    uses: ./.github/workflows/reusable-global-environment.yml

  detect-changed-files:
    name: Detect Changed Files
    if: ${{ needs.global-environment.outputs.GLOBAL_JOB_ENABLED == 'true' }}
    needs: global-environment
    runs-on: ${{ needs.global-environment.outputs.GLOBAL_RUNS_ON }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          token: ${{ github.token }}
          filters: .github/workflows/resources/filter/operation-filters.yml
    outputs:
      changed_operations: ${{ steps.filter.outputs.changes }}

  prepare-e2e-artifacts:
    name: Prepare E2E Artifacts
    if: needs.global-environment.outputs.GLOBAL_JOB_ENABLED == 'true' && needs.detect-changed-files.outputs.changed_operations != '[]'
    needs: [ global-environment, detect-changed-files ]
    runs-on: ${{ needs.global-environment.outputs.GLOBAL_RUNS_ON }}
    timeout-minutes: 40
    outputs:
      artifact-id: ${{ steps.upload-e2e-artifacts.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6.0.1
      - id: setup-build-environment
        uses: ./.github/actions/setup-build-environment
        with:
          maven-repository-dir: ${{ env.MAVEN_REPOSITORY_DIR }}
          cache-suffix: 'e2e-operation'
          cache-save-enabled: 'false'
          enable-docker-setup: 'true'
      - name: Restore E2E Image Cache
        id: prepare-image
        uses: ./.github/actions/prepare-e2e-docker
        with:
          type: source
          image: apache/shardingsphere-proxy-test
      - name: Build E2E Image
        run: ./mvnw -Dmaven.repo.local="$E2E_MAVEN_REPOSITORY" clean install -am -pl test/e2e/operation/transaction,test/e2e/operation/pipeline,test/e2e/operation/showprocesslist -Pe2e.env.docker -DskipTests -Ddocker.image.name="${{ steps.prepare-image.outputs.image }}" -Dexec.skip=${{ steps.prepare-image.outputs.cache-hit == 'true' }}
      - name: Save E2E Image Cache
        if: steps.prepare-image.outputs.cache-hit != 'true'
        uses: ./.github/actions/prepare-e2e-docker
        with:
          type: source
          operation: save
          image: ${{ steps.prepare-image.outputs.image }}
      - uses: ./.github/actions/save-maven-cache
        with:
          maven-repository-dir: ${{ env.MAVEN_REPOSITORY_DIR }}
          cache-hit: ${{ steps.setup-build-environment.outputs.cache-hit }}
          cache-primary-key: ${{ steps.setup-build-environment.outputs.cache-primary-key }}
      - id: upload-e2e-artifacts
        uses: ./.github/actions/upload-e2e-artifacts
        with:
          maven-repository-dir: ${{ env.MAVEN_REPOSITORY_DIR }}
          image-archive: ${{ steps.prepare-image.outputs.archive }}

  e2e-operation:
    name: E2E - ${{ matrix.operation }} on ${{ matrix.image.version }}
    if: needs.global-environment.outputs.GLOBAL_JOB_ENABLED == 'true' && needs.detect-changed-files.outputs.changed_operations != '[]'
    needs: [ detect-changed-files, global-environment, prepare-e2e-artifacts ]
    runs-on: ${{ needs.global-environment.outputs.GLOBAL_RUNS_ON }}
    timeout-minutes: 40
    strategy:
      max-parallel: 15
      fail-fast: false
      matrix:
        operation: ${{ fromJSON(needs.detect-changed-files.outputs.changed_operations) }}
        image: [
          { type: "e2e.docker.database.mysql.images", version: "mysql:5.7" },
          { type: "e2e.docker.database.mariadb.images", version: "mariadb:11" },
          { type: "e2e.docker.database.postgresql.images", version: "postgres:12-alpine" },
          { type: "e2e.docker.database.opengauss.images", version: "opengauss/opengauss:3.1.0" }
        ]
        exclude:
          - operation: transaction
            image: { type: "e2e.docker.database.mariadb.images", version: "mariadb:11" }
          - operation: showprocesslist
            image: { type: "e2e.docker.database.mariadb.images", version: "mariadb:11" }
          - operation: showprocesslist
            image: { type: "e2e.docker.database.postgresql.images", version: "postgres:12-alpine" }
          - operation: showprocesslist
            image: { type: "e2e.docker.database.opengauss.images", version: "opengauss/opengauss:3.1.0" }
    steps:
      - name: Logs
        run: |
          echo "runner.temp=${{ runner.temp }}"
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
      - uses: actions/checkout@v6.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-build-environment
        with:
          maven-repository-dir: ${{ env.MAVEN_REPOSITORY_DIR }}
          cache-suffix: 'e2e-operation'
          cache-save-enabled: 'false'
          enable-docker-setup: 'true'
      - id: download-e2e-artifacts
        uses: ./.github/actions/download-e2e-artifacts
        with:
          maven-repository-dir: ${{ env.MAVEN_REPOSITORY_DIR }}
          artifact-id: ${{ needs.prepare-e2e-artifacts.outputs.artifact-id }}
      - name: Run ${{ matrix.operation }} on ${{ matrix.image.version }}
        run: ./mvnw -Dmaven.repo.local="$E2E_MAVEN_REPOSITORY" -nsu install -f test/e2e/operation/${{ matrix.operation }}/pom.xml -De2e.run.type=docker -D${{ matrix.image.type }}=${{ matrix.image.version }} -De2e.docker.proxy.image="${{ steps.download-e2e-artifacts.outputs.image }}"
