name: 'Save Maven Cache'
description: 'Save Maven cache when restore misses on non-pull-request events'

inputs:
  cache-hit:
    description: 'Output cache-hit from restore step'
    required: true
  cache-primary-key:
    description: 'Output cache-primary-key from restore step'
    required: true
  enabled:
    description: 'Whether to enable cache save'
    required: false
    default: 'true'
  maven-repository-dir:
    description: 'Maven repository directory used by the restore step; empty keeps the default repository'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Save Maven Cache
      if: github.event_name != 'pull_request' && inputs.enabled == 'true' && inputs.cache-hit != 'true'
      uses: actions/cache/save@v5.0.1
      with:
        path: |
          ${{ inputs.maven-repository-dir || '~/.m2/repository' }}
          !${{ inputs.maven-repository-dir || '~/.m2/repository' }}/org/apache/shardingsphere
          ${{ inputs.maven-repository-dir || '~/.m2/repository' }}/org/apache/shardingsphere/elasticjob
        key: ${{ inputs.cache-primary-key }}
